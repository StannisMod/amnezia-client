name: Domain-preserving server migration
on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Archive boundaries and replay floors
        run: python3 client/tests/migration/test_agent.py
      - name: SSH identity before authentication and verified SFTP
        run: bash scripts/local-tests/migration-ssh.sh
      - name: Two isolated hosts with real WG, AWG, DNS, signed HTTPS and rollback
        run: bash scripts/local-tests/migration-scenario.sh
