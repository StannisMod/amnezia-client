name: Android routed VPN acceptance

on:
  push:
    branches: [dev, feature/sing-box-routing, feature/android-primary-awg-core]
    paths:
      - client/**
      - common/**
      - third_party/**
      - cmake/**
      - deploy/**
      - CMakeLists.txt
      - CMakePresets.json
      - .gitmodules
      - scripts/routing/android_host_sources.py
      - scripts/routing/test_android_host_sources.py
      - scripts/routing/test_android_upload_mtu_metrics.py
      - scripts/routing/test_android_app_policy_metrics.py
      - native/routing/androidbridge/**
      - scripts/routing/android/**
      - scripts/routing/android-app-probe/**
      - .github/workflows/routing-android-acceptance.yml
      - recipes/**
      - scripts/routing/android/**
      - scripts/routing/xray_ipv6_fixture.py
      - scripts/routing/build_xray_fixture.py
      - scripts/routing/run_android_acceptance.py
      - scripts/routing/run_android_ci_extra_acceptance.sh
      - scripts/routing/run_android_openvpn_acceptance.py
      - scripts/routing/android-openvpn/**
      - native/routing/cmd/android-fixture/**
      - native/routing/cmd/traffic-probe/**
      - native/routing/internal/fixturequic/**
      - native/routing/awg/**
      - native/routing/engine/**
      - native/routing/mobile/**
      - scripts/routing/ci_apt_mirrors.py
      - scripts/routing/build_android_native.sh
      - scripts/routing/replace_android_native.py
      - scripts/routing/verify_android_payload.py
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: Optional compatible full-client build run; auto-select when empty
        required: false
      cycles:
        description: Reconnect cycles (100 for acceptance)
        default: '100'
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: routing-android-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-apk-service:
    name: ${{ matrix.check_name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - {transport: awg, api: 35, focus: '', check_name: 'actual-apk-service (awg)'}
          - {transport: wireguard, api: 35, focus: '', check_name: 'actual-apk-service (wireguard)'}
          - {transport: awg, api: 29, focus: '--app-policy-only --package-lifecycle --private-dns-opportunistic', check_name: 'actual-apk-service (awg, API29 app policy)'}
          - {transport: wireguard, api: 29, focus: '--app-policy-only --package-lifecycle --private-dns-opportunistic', check_name: 'actual-apk-service (wireguard, API29 app policy)'}
          - {transport: awg, api: 28, focus: '--api28-compat-only', check_name: 'actual-apk-service (awg, API28 compatibility)'}
          - {transport: wireguard, api: 28, focus: '--api28-compat-only', check_name: 'actual-apk-service (wireguard, API28 compatibility)'}
    steps:
      - uses: actions/checkout@v4
      - name: Select direct Ubuntu mirrors and bound package network retries
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 scripts/routing/ci_apt_mirrors.py
      - name: Install isolated fault-test tools
        run: sudo apt-get update && sudo apt-get install -y nftables
      - name: Install local OpenVPN fixture server
        if: ${{ matrix.transport == 'awg' && (matrix.api == 35 || matrix.api == 28) }}
        run: sudo apt-get install -y openvpn
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/routing/go.mod
          cache-dependency-path: native/routing/go.sum
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Verify packaged-host compatibility boundary
        run: |
          python3 scripts/routing/test_android_host_sources.py
          python3 scripts/routing/test_android_upload_mtu_metrics.py
          python3 scripts/routing/test_android_app_policy_metrics.py
      - name: Select an APK with compatible production Android host sources
        env:
          GH_TOKEN: ${{ github.token }}
          APK_OVERRIDE: ${{ inputs.apk_run_id }}
        run: |
          python3 - <<'PYSELECT'
          import json, os, pathlib, subprocess, sys, time, urllib.error, urllib.parse, urllib.request
          sys.path.insert(0, 'scripts/routing')
          from android_host_sources import changed_host_sources
          repo = os.environ['GITHUB_REPOSITORY']
          branch = urllib.parse.quote(os.environ['GITHUB_REF_NAME'], safe='')
          def api(path):
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}', headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}"})
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as stream: return json.load(stream)
                  except urllib.error.HTTPError as error:
                      rate_limited = error.code == 403 and (
                          error.headers.get('X-RateLimit-Remaining') == '0'
                          or error.headers.get('Retry-After') is not None)
                      if (error.code not in (429, 500, 502, 503, 504) and not rate_limited) or attempt == 3:
                          print('GitHub API request failed:', error.code, path,
                                'remaining=', error.headers.get('X-RateLimit-Remaining'), flush=True)
                          raise
                      if rate_limited:
                          delay = min(120, max(1, int(error.headers.get('Retry-After', '60'))))
                          print('GitHub API rate limit; bounded retry in', delay, 'seconds', flush=True)
                          time.sleep(delay)
                  except urllib.error.URLError:
                      if attempt == 3: raise
                  time.sleep(2 ** attempt)
          override = os.environ.get('APK_OVERRIDE')
          compatibility = {}
          terminal_jobs = {}
          def compatible(sha):
              if sha not in compatibility:
                  subprocess.run(['git', 'fetch', '--depth', '1', 'origin', sha], check=True)
                  compatibility[sha] = not changed_host_sources(sha)
              return compatibility[sha]
          selected = None
          deadline = time.monotonic() + 125 * 60
          while time.monotonic() < deadline:
              candidates = [api(f'actions/runs/{override}')] if override else []
              if not override:
                  # A compatible APK can also come from the independent Android
                  # lane while desktop installed-service jobs remain in flight.
                  # This does not replace the full four-platform build gate.
                  for workflow in ('sing-box-routing-ci.yml', 'routing-android-package.yml'):
                      try:
                          candidates += api(f'actions/workflows/{workflow}/runs?branch={branch}&event=push&per_page=30')['workflow_runs']
                      except urllib.error.HTTPError as error:
                          if error.code != 404: raise
                  candidates.sort(key=lambda run: run['created_at'], reverse=True)
              for candidate in candidates:
                  if compatibility.get(candidate['head_sha']) is False:
                      continue
                  run_id = candidate['id']
                  if run_id in terminal_jobs:
                      jobs = terminal_jobs[run_id]
                  else:
                      jobs = api(f"actions/runs/{run_id}/jobs?per_page=100")['jobs']
                      if candidate['status'] == 'completed':
                          terminal_jobs[run_id] = jobs
                  android = [j for j in jobs if j['name'] == 'client-android (x86_64, android_x86_64)']
                  if not android or android[0]['status'] != 'completed' or android[0]['conclusion'] != 'success':
                      continue
                  if not compatible(candidate['head_sha']):
                      assert not override, 'Requested APK has incompatible production Android host sources'
                      continue
                  artifacts = api(f"actions/runs/{candidate['id']}/artifacts?per_page=100")['artifacts']
                  if any(a['name'] == 'routing-client-android-x86_64-baseline' and not a['expired'] for a in artifacts):
                      selected = str(candidate['id'])
                      break
              if selected: break
              assert not override, 'Requested APK build is not ready or has no usable artifact'
              print('Waiting for an APK with identical production Android host sources', flush=True)
              time.sleep(15)
          if not selected: raise TimeoutError('Compatible Android full-client build did not finish within its build budget')
          with open(os.environ['GITHUB_ENV'], 'a') as stream: stream.write(f'APK_RUN={selected}\n')
          PYSELECT
      - uses: actions/download-artifact@v4
        with:
          name: routing-client-android-x86_64-baseline
          run-id: ${{ env.APK_RUN }}
          github-token: ${{ github.token }}
          path: downloaded-apk
      - name: Record tested source and select packaged feature APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          req = urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['APK_RUN']}", headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}"})
          with urllib.request.urlopen(req) as stream: source = json.load(stream)
          assert source['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          req = urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['APK_RUN']}/jobs?per_page=100", headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}"})
          with urllib.request.urlopen(req) as stream: jobs = json.load(stream)['jobs']
          android = [j for j in jobs if j['name'] == 'client-android (x86_64, android_x86_64)']
          assert len(android) == 1 and android[0]['conclusion'] == 'success', 'APK job must have passed'
          # Other platforms remain independently required by the full build gate;
          # they need not block native testing of an already-built compatible APK.
          source['android_job_id'] = android[0]['id']
          source['full_matrix_status'] = source['status']
          source['full_matrix_conclusion'] = source['conclusion']
          pathlib.Path('tested-apk-source.json').write_text(json.dumps({k: source[k] for k in ('id', 'head_sha', 'html_url', 'android_job_id', 'full_matrix_status', 'full_matrix_conclusion')}, indent=2))
          candidates = sorted(pathlib.Path('downloaded-apk').rglob('*debug.apk'))
          assert candidates, 'No debug APK from the actual client build'
          with open(os.environ['GITHUB_ENV'], 'a') as env: env.write(f'FEATURE_APK={candidates[0].resolve()}\n')
          PY
      - name: Build the current unified JNI payload for the unchanged packaged host
        env:
          ABI: x86_64
        run: |
          for attempt in 1 2 3; do
            if sdkmanager --install 'ndk;27.0.12077973'; then break; fi
            if test "$attempt" = 3; then exit 1; fi
          done
          bash scripts/routing/build_android_native.sh "$RUNNER_TEMP/current-native"
          baseline=$(python3 -c 'import json; print(json.load(open("tested-apk-source.json"))["head_sha"])')
          git fetch --depth 1 origin "$baseline"
          python3 scripts/routing/replace_android_native.py --apk "$FEATURE_APK" --native "$RUNNER_TEMP/current-native/libwg-go.so" --output "$RUNNER_TEMP/current-feature.apk" --baseline-sha "$baseline"
          echo "FEATURE_APK=$RUNNER_TEMP/current-feature.apk" >> "$GITHUB_ENV"
      - name: Build separate native Android QUIC probe
        working-directory: native/routing
        env:
          GOOS: android
          GOARCH: amd64
          CGO_ENABLED: "1"
        run: |
          export CC="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android28-clang"
          go build -mod=readonly -tags amnezia_android_probe -buildmode=pie -o "$RUNNER_TEMP/android-traffic-probe" ./cmd/traffic-probe
      - name: Build the disposable AWG peer and independent egress observers
        working-directory: native/routing
        run: go build -mod=readonly -tags with_gvisor,acceptance_trace -o "$RUNNER_TEMP/android-fixture" ./cmd/android-fixture
      - name: Build the Xray peer from the Android libxray dependency pin
        if: ${{ matrix.transport == 'awg' && matrix.api != 28 }}
        run: python3 scripts/routing/build_xray_fixture.py --work "$RUNNER_TEMP/xray-source" --output "$RUNNER_TEMP/xray-fixture" --report "$RUNNER_TEMP/xray-fixture-provenance.json"
      - name: Enable KVM for the disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual APK, VpnService capture, protected sockets and 100-cycle acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          avd-name: amnezia-routing
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          # The action writes hw.heapSize, but AVD uses vm.heapSize (integer
          # MiB). Normalize RAM too instead of relying on integer parsing of M.
          pre-emulator-launch-script: |
            sed -i -E '/^(hw.ramSize|hw.heapSize|vm.heapSize)=/d' "$ANDROID_AVD_HOME/amnezia-routing.avd/config.ini"
            printf 'hw.ramSize=3072\nvm.heapSize=512\n' >> "$ANDROID_AVD_HOME/amnezia-routing.avd/config.ini"
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell getprop dalvik.vm.heapsize
            adb shell getprop dalvik.vm.heapgrowthlimit
            adb shell cat /proc/meminfo | head -n 3
            python3 -c 'import subprocess,re; mem=subprocess.check_output(["adb","shell","cat","/proc/meminfo"],text=True); assert int(re.search(r"MemTotal:\s+(\d+)",mem)[1]) >= 2*1024*1024, "AVD RAM configuration was not applied"; heap=subprocess.check_output(["adb","shell","getprop","dalvik.vm.heapsize"],text=True).strip().lower(); assert re.fullmatch(r"\d+m",heap) and int(heap[:-1]) >= 256, "AVD heap configuration was not applied: "+heap'
            sudo ip addr add 198.51.100.2/32 dev lo
            "$RUNNER_TEMP/android-fixture" --shared-ip 198.51.100.2 --endpoint-host 10.0.2.2 --transport "${{ matrix.transport }}" --persistent --bulk --native-dns-port 1053 --native-dot-port 8853 --config "$RUNNER_TEMP/fixture.json" --quic-ca "$RUNNER_TEMP/quic.der" > fixture-server.log 2>&1 & echo $! > "$RUNNER_TEMP/fixture.pid"
            for i in $(seq 1 30); do test -s "$RUNNER_TEMP/fixture.json" && break; sleep 1; done
            python3 scripts/routing/run_android_acceptance.py --apk "$FEATURE_APK" --fixture "$RUNNER_TEMP/fixture.json" --observer-ip 198.51.100.2 --quic-probe "$RUNNER_TEMP/android-traffic-probe" --quic-ca "$RUNNER_TEMP/quic.der" --work "$RUNNER_TEMP/android-acceptance" --cycles "${{ inputs.cycles || '100' }}" ${{ matrix.focus }} --apk-source-sha "$(python3 -c 'import json;print(json.load(open("tested-apk-source.json"))["head_sha"])')"
            if [ "${{ matrix.api }}" = 29 ]; then python3 scripts/routing/run_android_work_profile.py --apk "$FEATURE_APK" --fixture "$RUNNER_TEMP/fixture.json" --observer-ip 198.51.100.2 --quic-probe "$RUNNER_TEMP/android-traffic-probe" --quic-ca "$RUNNER_TEMP/quic.der" --work "$RUNNER_TEMP/android-work-profile-acceptance" --apk-source-sha "$(python3 -c 'import json;print(json.load(open("tested-apk-source.json"))["head_sha"])')"; fi
            if [ "${{ matrix.api }}" = 29 ]; then python3 scripts/routing/run_android_acceptance.py --private-dns-policy-only --apk "$FEATURE_APK" --fixture "$RUNNER_TEMP/fixture.json" --observer-ip 198.51.100.2 --quic-probe "$RUNNER_TEMP/android-traffic-probe" --quic-ca "$RUNNER_TEMP/quic.der" --work "$RUNNER_TEMP/android-private-dns-policy" --apk-source-sha "$(python3 -c 'import json;print(json.load(open("tested-apk-source.json"))["head_sha"])')"; fi
            bash scripts/routing/run_android_ci_extra_acceptance.sh "${{ matrix.transport }}" "${{ matrix.api }}"
      - name: Stop the local peer and remove ephemeral private configuration
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/fixture.pid"; then kill "$(cat "$RUNNER_TEMP/fixture.pid")" || true; fi
          if test -f "$RUNNER_TEMP/xray-fixture.pid"; then sudo kill "$(cat "$RUNNER_TEMP/xray-fixture.pid")" || true; fi
          if sudo test -f "$RUNNER_TEMP/xray-peer/xray.log"; then sudo cat "$RUNNER_TEMP/xray-peer/xray.log" > xray-server.log; fi
          sudo rm -f "$RUNNER_TEMP/xray-peer/fixture.json" "$RUNNER_TEMP/xray-peer/server.json" "$RUNNER_TEMP/xray-peer/server.key"
          rm -f "$RUNNER_TEMP/fixture.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-actual-apk-acceptance-${{ matrix.transport }}-api${{ matrix.api }}
          if-no-files-found: error
          path: |
            tested-apk-source.json
            ${{ runner.temp }}/current-feature.json
            fixture-server.log
            ${{ runner.temp }}/android-acceptance/instrumentation.log
            ${{ runner.temp }}/android-acceptance/android-acceptance.json
            ${{ runner.temp }}/android-acceptance/routes.log
            ${{ runner.temp }}/android-acceptance/rules.log
            ${{ runner.temp }}/android-acceptance/connectivity.log
            ${{ runner.temp }}/android-acceptance/service-errors.log
            ${{ runner.temp }}/android-acceptance/network-events.log
            ${{ runner.temp }}/android-acceptance/failure-*.log
            ${{ runner.temp }}/android-work-profile-acceptance/android-acceptance.json
            ${{ runner.temp }}/android-work-profile-acceptance/*.log
            ${{ runner.temp }}/android-private-dns-policy/android-acceptance.json
            ${{ runner.temp }}/android-private-dns-policy/*.log
            ${{ runner.temp }}/xray-fixture-provenance.json
            xray-fixture.log
            xray-server.log
            ${{ runner.temp }}/android-xray-ipv6/android-acceptance.json
            ${{ runner.temp }}/android-xray-ipv6/*.log
            ${{ runner.temp }}/android-openvpn-ipv6/openvpn-acceptance.json
            ${{ runner.temp }}/android-openvpn-ipv6/*-server.log
            ${{ runner.temp }}/android-openvpn-ipv6/*/android-acceptance.json
            ${{ runner.temp }}/android-openvpn-ipv6/*/*.log
