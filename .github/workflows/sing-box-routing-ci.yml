name: Sing-box routing checks

on:
  push:
    branches: [feature/sing-box-routing]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native/routing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/routing/go.mod
          cache-dependency-path: native/routing/go.sum
      - name: Unit and local network integration tests
        shell: bash
        run: |
          set -o pipefail
          go test -mod=readonly -tags with_gvisor -race -count=3 -json ./... | tee test-results.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-tests-${{ matrix.os }}
          path: native/routing/test-results.jsonl
          if-no-files-found: error

  core-cross-compile:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: android, goarch: arm64}
          - {goos: android, goarch: arm, goarm: '7'}
          - {goos: android, goarch: '386'}
          - {goos: android, goarch: amd64}
          - {goos: ios, goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: linux, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/routing/go.mod
          cache-dependency-path: native/routing/go.sum
      - name: Compile Go packages only (no native linking or device claim)
        working-directory: native/routing
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: go build -mod=readonly -tags with_gvisor ./...

  client-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/routing/go.mod
          cache-dependency-path: native/routing/go.sum
      - uses: actions/setup-python@v6
        with: {python-version: '3.14'}
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.10.1'
          arch: linux_gcc_64
          modules: qtremoteobjects qt5compat qtshadertools qthttpserver qtwebsockets
          tools: tools_ifw
          dir: ${{ runner.temp }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libsecret-1-dev
          pip install conan==2.28.0
          conan profile detect --force
      - name: Qt-to-core rule migration contract
        run: |
          cmake -S client/tests/routing -B routing-contract-build -DCMAKE_PREFIX_PATH="${{ runner.temp }}/Qt/6.10.1/gcc_64"
          cmake --build routing-contract-build
          ctest --test-dir routing-contract-build --output-on-failure
      - name: Build client, service and installer using existing entry point
        id: build
        shell: bash
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
          AMNEZIA_BUILD_TESTS: 'ON'
        run: |
          set -o pipefail
          deploy/build.sh --generator Ninja --installer all 2>&1 | tee client-build.log
      - name: Record baseline result
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: python scripts/routing/build_manifest.py linux
      - name: Existing settings and rule UI regression tests
        if: success()
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir deploy/build/client/tests --output-on-failure -R 'UiIpModelAndControllerTest|SettingsSignalsTest|BackupExportImportTest|DomainRoutingContractTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-client-linux-baseline
          path: |
            client-build.log
            routing-build-manifest.json
            deploy/build/AmneziaVPN_*_linux_x64.run

  client-windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-python@v6
        with: {python-version: '3.14'}
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.10.1'
          arch: win64_msvc2022_64
          modules: qtremoteobjects qt5compat qtshadertools qthttpserver qtwebsockets
          tools: tools_ifw
          dir: ${{ runner.temp }}
      - uses: ilammy/msvc-dev-cmd@v1
        with: {arch: x64}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Dependencies (same WiX version as deploy.yml)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          wix extension add -g WixToolset.UI.wixext/4.0.6
          wix extension add -g WixToolset.Util.wixext/4.0.6
          pip install conan==2.28.0
          conan profile detect --force
      - name: Build client, service and both installers
        id: build
        shell: cmd
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
          AMNEZIA_BUILD_TESTS: 'ON'
        run: |
          set WIX_ROOT_PATH=%USERPROFILE%\.dotnet\tools
          call deploy\build.bat --installer all > client-build.log 2>&1
          set BUILD_RESULT=%ERRORLEVEL%
          type client-build.log
          exit /b %BUILD_RESULT%
      - name: Record baseline result
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: python scripts/routing/build_manifest.py windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-client-windows-baseline
          path: |
            client-build.log
            routing-build-manifest.json
            deploy/build/AmneziaVPN_*_windows_x64.exe
            deploy/build/AmneziaVPN_*_windows_x64.msi

  client-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {abi: arm64-v8a, qt_arch: android_arm64_v8a}
          - {abi: armeabi-v7a, qt_arch: android_armv7}
          - {abi: x86_64, qt_arch: android_x86_64}
          - {abi: x86, qt_arch: android_x86}
    env:
      APP_ANDROID_MIN_SDK: '28'
      ANDROID_PLATFORM: android-28
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-python@v6
        with: {python-version: '3.14'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-28 platforms;android-36 build-tools;36.0.0'
      - name: Install pinned NDK (retry transient SDK archive failures)
        run: |
          for attempt in 1 2 3; do
            if sdkmanager --install 'ndk;27.0.12077973'; then exit 0; fi
          done
          exit 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/routing/go.mod
          cache-dependency-path: native/routing/go.sum
      - name: Compile protocol Kotlin without Qt or Conan
        run: python scripts/routing/check_android_kotlin.py --build-dir "${{ runner.temp }}/routing-kotlin-check"
      - name: Build and inspect the unified Go JNI payload
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
          GOTOOLCHAIN: local
          GOTELEMETRY: 'off'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v3.1.20260814 https://github.com/amnezia-vpn/amneziawg-android.git "$RUNNER_TEMP/routing-awg"
          test "$(git -C "$RUNNER_TEMP/routing-awg" rev-parse HEAD)" = 5c16489e2cd9ed3a0a7a27c7445bba5238132f86
          python native/routing/prepare_android.py --module "$RUNNER_TEMP/routing-awg/tunnel/tools/libwg-go" --go-root "$(go env GOROOT)" --patched-go-root "$RUNNER_TEMP/routing-go"
          export GOROOT="$RUNNER_TEMP/routing-go"
          export PATH="$GOROOT/bin:$PATH"
          case "$ABI" in
            arm64-v8a) export GOARCH=arm64; target=aarch64-linux-android28 ;;
            armeabi-v7a) export GOARCH=arm GOARM=7; target=armv7a-linux-androideabi28 ;;
            x86) export GOARCH=386; target=i686-linux-android28 ;;
            x86_64) export GOARCH=amd64; target=x86_64-linux-android28 ;;
          esac
          tools="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC="$tools/$target-clang"
          export CGO_ENABLED=1 GOOS=android
          export CGO_LDFLAGS='-Wl,-soname=libwg-go.so -Wl,-z,max-page-size=16384'
          output="$GITHUB_WORKSPACE/deploy/routing-native/$ABI"
          mkdir -p "$output"
          (cd "$RUNNER_TEMP/routing-awg/tunnel/tools/libwg-go" && go build -mod=readonly -tags linux,with_gvisor,amnezia_android_bridge -trimpath -buildvcs=false -buildmode=c-shared -o "$output/libwg-go.so" .)
          "$tools/llvm-readelf" --dyn-syms -W "$output/libwg-go.so" > "$output/symbols.txt"
          for symbol in Java_org_amnezia_awg_GoBackend_awgTurnOn Java_org_amnezia_awg_RoutingBackend_start Java_org_amnezia_awg_RoutingBackend_stop Java_org_amnezia_awg_RoutingBackend_stats; do
            grep -F "$symbol" "$output/symbols.txt"
          done
          test "$(grep -c '_cgo_topofstack$' "$output/symbols.txt")" = 1
          "$tools/llvm-readelf" -l -W "$output/libwg-go.so" > "$output/elf-layout.txt"
          sha256sum "$output/libwg-go.so" > "$output/SHA256SUMS"
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.10.1'
          arch: linux_gcc_64
          modules: qtremoteobjects qt5compat qtimageformats qtshadertools
          dir: ${{ runner.temp }}
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.10.1'
          host: all_os
          target: android
          arch: ${{ matrix.qt_arch }}
          modules: qtremoteobjects qt5compat qtimageformats qtshadertools
          dir: ${{ runner.temp }}
      - run: |
          pip install conan==2.28.0
          conan profile detect --force
      - name: Build debug-signed APK with existing script
        id: build
        shell: bash
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
          CMAKE_BUILD_TYPE: Debug
          ABI: ${{ matrix.abi }}
          ANDROID_NDK_VERSION: '27.0.12077973'
        run: |
          set -o pipefail
          deploy/build.sh -t android --abi "$ABI" --apk 2>&1 | tee client-build.log
      - name: Inspect native JNI in the actual APK
        id: payload
        run: python scripts/routing/verify_android_payload.py --build-dir deploy/build --readelf "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
      - name: Record baseline result
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ROUTING_ABI: ${{ matrix.abi }}
          ROUTING_PAYLOAD_OUTCOME: ${{ steps.payload.outcome }}
        run: python scripts/routing/build_manifest.py android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-client-android-${{ matrix.abi }}-baseline
          path: |
            client-build.log
            routing-build-manifest.json
            deploy/build/client/android-build/**/*.apk
            deploy/routing-native/
            android-routing-payloads.json

  client-ios:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: '26.0'}
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/routing/go.mod
          cache-dependency-path: native/routing/applebridge/module.sum
      - name: Build unified AWG-XRay-routing archive and typecheck public packet-flow adapter
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOTELEMETRY: 'off'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v3.1.4 https://github.com/amnezia-vpn/amneziawg-apple.git "$RUNNER_TEMP/routing-apple"
          test "$(git -C "$RUNNER_TEMP/routing-apple" rev-parse HEAD)" = 811f5c8213e6b257e9520fff713ec4d22086e9ac
          module="$RUNNER_TEMP/routing-apple/Sources/WireGuardKitGo"
          python3 native/routing/prepare_apple.py --module "$module"
          make -C "$module" ARCHS=arm64 PLATFORM_NAME=iphoneos
          nm -g "$module/out/libwg-go.a" > "$RUNNER_TEMP/routing-apple-symbols.txt"
          for symbol in _AmneziaRoutingStart _AmneziaRoutingFeed _AmneziaRoutingStop _AmneziaRoutingStats _wgTurnOn; do
            grep -E " T $symbol$" "$RUNNER_TEMP/routing-apple-symbols.txt"
          done
          xcrun --sdk iphoneos swiftc -typecheck -target arm64-apple-ios15.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -import-objc-header "$module/amnezia_routing.h" client/platforms/ios/WGConfig.swift client/platforms/ios/RoutingPacketTunnel.swift
          (cd "$module" && go build -mod=readonly -tags with_gvisor,amnezia_apple_bridge -buildmode=c-shared -o "$RUNNER_TEMP/routing-apple-host.dylib" .)
          python3 scripts/routing/check_packet_flow_abi.py "$RUNNER_TEMP/routing-apple-host.dylib"
      - uses: actions/setup-python@v6
        with: {python-version: '3.14'}
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.10.1'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtremoteobjects qt5compat qtshadertools qtmultimedia
          dir: ${{ runner.temp }}
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.10.1'
          host: mac
          target: ios
          modules: qtremoteobjects qt5compat qtshadertools qtmultimedia
          dir: ${{ runner.temp }}
      - run: |
          pip install conan==2.28.0 jsonschema jinja2
          conan profile detect --force
      - name: Compile app and packet tunnel without distribution signing
        id: build
        shell: bash
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
          IOS_UNSIGNED_BUILD: '1'
        run: |
          set -o pipefail
          deploy/build.sh -t ios 2>&1 | tee client-build.log
      - name: Record baseline result (signed IPA remains blocked)
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: python scripts/routing/build_manifest.py ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-client-ios-unsigned-baseline
          path: |
            client-build.log
            routing-build-manifest.json
            deploy/build/client/Release-iphoneos/*.app

  build-gate:
    if: always()
    needs: [core-tests, core-cross-compile, client-linux, client-windows, client-android, client-ios]
    runs-on: ubuntu-22.04
    steps:
      - name: Fail for any failed, cancelled or skipped required lane
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          for name, job in results.items():
              print(name, job['result'])
          if any(job['result'] != 'success' for job in results.values()):
              raise SystemExit(1)
          print('Compilation/test gate only; native VPN acceptance is still outstanding.')
          PY
