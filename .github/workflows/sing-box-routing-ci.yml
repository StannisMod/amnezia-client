name: Sing-box routing checks

on:
  push:
    branches: [feature/sing-box-routing]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'scripts/routing/**'
      - '.github/workflows/routing-*.yml'
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routing-product-v2-${{ github.ref }}
  # A CI-only follow-up can reuse an already verified compatible APK while
  # the existing full matrix finishes. Source fixes still supersede old builds.
  cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, 'ci(routing):') }}

jobs:
  core-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native/routing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/routing/go.mod
          cache-dependency-path: native/routing/go.sum
      - name: Download pinned Go modules (retry transient network failures)
        shell: bash
        working-directory: native/routing
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              go mod verify
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Unit and local network integration tests
        shell: bash
        run: |
          set -o pipefail
          go test -mod=readonly -tags with_gvisor -race -count=3 -json ./... | tee test-results.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-tests-${{ matrix.os }}
          path: native/routing/test-results.jsonl
          if-no-files-found: error

  core-cross-compile:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: android, goarch: arm64}
          - {goos: android, goarch: arm, goarm: '7'}
          - {goos: android, goarch: '386'}
          - {goos: android, goarch: amd64}
          - {goos: ios, goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: linux, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/routing/go.mod
          cache-dependency-path: native/routing/go.sum
      - name: Download pinned Go modules (retry transient network failures)
        shell: bash
        working-directory: native/routing
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              go mod verify
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Compile Go packages only (no native linking or device claim)
        working-directory: native/routing
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: go build -mod=readonly -tags with_gvisor ./...

  client-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/routing/go.mod
          cache-dependency-path: native/routing/go.sum
      - name: Download pinned Go modules (retry transient network failures)
        shell: bash
        working-directory: native/routing
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              go mod verify
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done
      - uses: actions/setup-python@v6
        with: {python-version: '3.14'}
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.10.1'
          arch: linux_gcc_64
          modules: qtremoteobjects qt5compat qtshadertools qthttpserver qtwebsockets
          tools: tools_ifw
          dir: ${{ runner.temp }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libsecret-1-dev
          pip install conan==2.28.0
          conan profile detect --force
      - name: Qt-to-core rule migration contract
        run: |
          cmake -S client/tests/routing -B routing-contract-build -DCMAKE_PREFIX_PATH="${{ runner.temp }}/Qt/6.10.1/gcc_64"
          cmake --build routing-contract-build
          ctest --test-dir routing-contract-build --output-on-failure
      - name: Build client, service and installer using existing entry point
        id: build
        shell: bash
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
          AMNEZIA_BUILD_TESTS: 'ON'
        run: |
          set -o pipefail
          deploy/build.sh --generator Ninja --installer all 2>&1 | tee client-build.log
      - name: Record baseline result
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: python scripts/routing/build_manifest.py linux
      - name: Existing settings and rule UI regression tests
        if: success()
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir deploy/build/client/tests -V --timeout 120 --output-junit qt-regression.xml
      - name: Build installed-service IPC probe and disposable peer
        run: |
          cmake -S scripts/routing/service-probe -B routing-service-probe-build -DCMAKE_PREFIX_PATH="${{ runner.temp }}/Qt/6.10.1/gcc_64"
          cmake --build routing-service-probe-build
          cd native/routing
          go build -mod=readonly -tags with_gvisor -o "$RUNNER_TEMP/installed-routing-peer" ./cmd/android-fixture
      - name: Install RUN package and verify actual Qt service and system resolver
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          packages=(deploy/build/AmneziaVPN_*_linux_x64.run)
          chmod +x "${packages[0]}"
          sudo env QT_QPA_PLATFORM=offscreen "${packages[0]}" --root /opt/AmneziaVPN --accept-licenses --default-answer --confirm-command install
          sudo systemctl daemon-reload
          sudo systemctl restart AmneziaVPN
          sudo timeout --signal=INT --kill-after=30s 600s python3 -u scripts/routing/run_service_acceptance.py --require-notices --peer "$RUNNER_TEMP/installed-routing-peer" --qt-probe "$GITHUB_WORKSPACE/routing-service-probe-build/routing-service-probe" --report "$GITHUB_WORKSPACE/linux-installed-service.json" --resolver-cycles 100 --ci-rescue
      - name: Remove installed test package
        if: always()
        run: |
          if [ -x /opt/AmneziaVPN/maintenancetool ]; then
            sudo env QT_QPA_PLATFORM=offscreen /opt/AmneziaVPN/maintenancetool --default-answer --confirm-command purge
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-client-linux-baseline
          path: |
            client-build.log
            routing-build-manifest.json
            deploy/build/client/tests/qt-regression.xml
            deploy/build/client/tests/Testing/Temporary/LastTest.log
            deploy/build/AmneziaVPN_*_linux_x64.run
            linux-installed-service.json
            linux-installed-service.rescue.json

  client-windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/routing/go.mod
          cache-dependency-path: native/routing/go.sum
      - name: Download pinned Go modules (retry transient network failures)
        shell: bash
        working-directory: native/routing
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              go mod verify
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done
      - uses: actions/setup-python@v6
        with: {python-version: '3.14'}
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.10.1'
          arch: win64_msvc2022_64
          modules: qtremoteobjects qt5compat qtshadertools qthttpserver qtwebsockets
          tools: tools_ifw
          dir: ${{ runner.temp }}
      - uses: ilammy/msvc-dev-cmd@v1
        with: {arch: x64}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Dependencies (same WiX version as deploy.yml)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          wix extension add -g WixToolset.UI.wixext/4.0.6
          wix extension add -g WixToolset.Util.wixext/4.0.6
          pip install conan==2.28.0
          conan profile detect --force
      - name: Build client, service and both installers
        id: build
        shell: cmd
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
          AMNEZIA_BUILD_TESTS: 'ON'
        run: |
          set WIX_ROOT_PATH=%USERPROFILE%\.dotnet\tools
          call deploy\build.bat --installer all > client-build.log 2>&1
          set BUILD_RESULT=%ERRORLEVEL%
          type client-build.log
          exit /b %BUILD_RESULT%
      - name: Windows settings and application-scope regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir deploy/build/client/tests -C Release -V --timeout 120 --output-junit qt-regression.xml
      - name: Record baseline result
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: python scripts/routing/build_manifest.py windows
      - name: Build installed-service IPC probe and disposable peer
        shell: pwsh
        run: |
          cmake -S scripts/routing/service-probe -B routing-service-probe-build -DCMAKE_PREFIX_PATH="$env:RUNNER_TEMP/Qt/6.10.1/msvc2022_64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build routing-service-probe-build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location native/routing
          go build -mod=readonly -tags with_gvisor -o "$env:RUNNER_TEMP/installed-routing-peer.exe" ./cmd/android-fixture
          exit $LASTEXITCODE
      - name: Install MSI and verify actual LocalSystem Qt service
        timeout-minutes: 10
        shell: pwsh
        run: |
          $msi = (Get-ChildItem deploy/build/AmneziaVPN_*_windows_x64.msi | Select-Object -First 1).FullName
          ./scripts/routing/run_windows_installer.ps1 -Kind msi -Package $msi
          Start-Service AmneziaVPN-service
          (Get-Service AmneziaVPN-service).WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
          python -u scripts/routing/run_service_acceptance.py --require-notices --peer "$env:RUNNER_TEMP/installed-routing-peer.exe" --qt-probe "$env:GITHUB_WORKSPACE/routing-service-probe-build/Release/routing-service-probe.exe" --report windows-installed-service.json
          exit $LASTEXITCODE
      - name: Remove installed MSI
        if: always()
        shell: pwsh
        run: |
          $msi = Get-ChildItem deploy/build/AmneziaVPN_*_windows_x64.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            ./scripts/routing/run_windows_installer.ps1 -Kind msi -Package $msi.FullName -Uninstall -LogPath routing-msi-remove.log
          }
      - name: Install EXE and verify packaged service
        timeout-minutes: 10
        shell: pwsh
        run: |
          $exe = (Get-ChildItem deploy/build/AmneziaVPN_*_windows_x64.exe | Select-Object -First 1).FullName
          $target = "$env:ProgramFiles/AmneziaVPN"
          ./scripts/routing/run_windows_installer.ps1 -Kind exe -Package $exe
          Start-Service AmneziaVPN-service
          (Get-Service AmneziaVPN-service).WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
          python -u scripts/routing/run_service_acceptance.py --require-notices --peer "$env:RUNNER_TEMP/installed-routing-peer.exe" --qt-probe "$env:GITHUB_WORKSPACE/routing-service-probe-build/Release/routing-service-probe.exe" --report windows-exe-installed-service.json
          exit $LASTEXITCODE
      - name: Remove installed EXE package
        if: always()
        shell: pwsh
        run: |
          $maintenance = "$env:ProgramFiles/AmneziaVPN/maintenancetool.exe"
          if (Test-Path $maintenance) {
            ./scripts/routing/run_windows_installer.ps1 -Kind exe -Package $maintenance -Uninstall
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-client-windows-baseline
          path: |
            client-build.log
            routing-build-manifest.json
            deploy/build/client/tests/qt-regression.xml
            deploy/build/client/tests/Testing/Temporary/LastTest.log
            deploy/build/AmneziaVPN_*_windows_x64.exe
            deploy/build/AmneziaVPN_*_windows_x64.msi
            windows-installed-service.json
            windows-exe-installed-service.json
            routing-msi-install.log

  client-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {abi: arm64-v8a, qt_arch: android_arm64_v8a}
          - {abi: armeabi-v7a, qt_arch: android_armv7}
          - {abi: x86_64, qt_arch: android_x86_64}
          - {abi: x86, qt_arch: android_x86}
    env:
      APP_ANDROID_MIN_SDK: '28'
      ANDROID_PLATFORM: android-28
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-python@v6
        with: {python-version: '3.14'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-28 platforms;android-36 build-tools;36.0.0'
      - name: Install pinned NDK (retry transient SDK archive failures)
        run: |
          for attempt in 1 2 3; do
            if sdkmanager --install 'ndk;27.0.12077973'; then exit 0; fi
          done
          exit 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/routing/go.mod
          cache-dependency-path: native/routing/go.sum
      - name: Download pinned Go modules (retry transient network failures)
        shell: bash
        working-directory: native/routing
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              go mod verify
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Compile protocol Kotlin without Qt or Conan
        run: python scripts/routing/check_android_kotlin.py --build-dir "${{ runner.temp }}/routing-kotlin-check"
      - name: Build and inspect the unified Go JNI payload
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
          GOTOOLCHAIN: local
          GOTELEMETRY: 'off'
        run: |
          bash scripts/routing/build_android_native.sh "$GITHUB_WORKSPACE/deploy/routing-native/$ABI"
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.10.1'
          arch: linux_gcc_64
          modules: qtremoteobjects qt5compat qtimageformats qtshadertools
          dir: ${{ runner.temp }}
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.10.1'
          host: all_os
          target: android
          arch: ${{ matrix.qt_arch }}
          modules: qtremoteobjects qt5compat qtimageformats qtshadertools
          dir: ${{ runner.temp }}
      - run: |
          pip install conan==2.28.0
          conan profile detect --force
      - name: Build debug-signed APK with existing script
        id: build
        shell: bash
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
          CMAKE_BUILD_TYPE: Debug
          ABI: ${{ matrix.abi }}
          ANDROID_NDK_VERSION: '27.0.12077973'
        run: |
          set -o pipefail
          deploy/build.sh -t android --abi "$ABI" --apk 2>&1 | tee client-build.log
      - name: Android network callback lifecycle unit tests
        if: matrix.abi == 'x86_64'
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess
          candidates = sorted(p for p in Path('deploy/build/client').rglob('gradlew') if (p.parent / 'utils').is_dir())
          assert candidates, 'Generated Android Gradle project missing'
          wrapper = candidates[0].resolve()
          subprocess.run([str(wrapper), ':utils:testDebugUnitTest', '--no-daemon'], cwd=wrapper.parent, check=True, timeout=300)
          PYCODE
      - name: Inspect native JNI in the actual APK
        id: payload
        run: python scripts/routing/verify_android_payload.py --build-dir deploy/build --readelf "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
      - name: Record baseline result
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ROUTING_ABI: ${{ matrix.abi }}
          ROUTING_PAYLOAD_OUTCOME: ${{ steps.payload.outcome }}
        run: python scripts/routing/build_manifest.py android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-client-android-${{ matrix.abi }}-baseline
          path: |
            client-build.log
            routing-build-manifest.json
            deploy/build/client/tests/qt-regression.xml
            deploy/build/client/tests/Testing/Temporary/LastTest.log
            deploy/build/client/android-build/**/*.apk
            deploy/routing-native/
            android-routing-payloads.json
            deploy/build/client/**/utils/build/test-results/**/*.xml

  client-ios:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: '26.0'}
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/routing/go.mod
          cache-dependency-path: native/routing/applebridge/module.sum
      - name: Build unified AWG-XRay-routing archive and typecheck public packet-flow adapter
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOTELEMETRY: 'off'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v3.1.4 https://github.com/amnezia-vpn/amneziawg-apple.git "$RUNNER_TEMP/routing-apple"
          test "$(git -C "$RUNNER_TEMP/routing-apple" rev-parse HEAD)" = 811f5c8213e6b257e9520fff713ec4d22086e9ac
          module="$RUNNER_TEMP/routing-apple/Sources/WireGuardKitGo"
          python3 native/routing/prepare_apple.py --module "$module"
          make -C "$module" ARCHS=arm64 PLATFORM_NAME=iphoneos
          nm -g "$module/out/libwg-go.a" > "$RUNNER_TEMP/routing-apple-symbols.txt"
          for symbol in _AmneziaRoutingStart _AmneziaRoutingFeed _AmneziaRoutingStop _AmneziaRoutingStats _wgTurnOn; do
            grep -E " T $symbol$" "$RUNNER_TEMP/routing-apple-symbols.txt"
          done
          xcrun --sdk iphoneos swiftc -typecheck -target arm64-apple-ios15.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -import-objc-header "$module/amnezia_routing.h" client/platforms/ios/WGConfig.swift client/platforms/ios/RoutingPacketTunnel.swift
          (cd "$module" && go build -mod=readonly -tags with_gvisor,amnezia_apple_bridge -buildmode=c-shared -o "$RUNNER_TEMP/routing-apple-host.dylib" .)
          python3 scripts/routing/check_packet_flow_abi.py "$RUNNER_TEMP/routing-apple-host.dylib"
      - uses: actions/setup-python@v6
        with: {python-version: '3.14'}
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.10.1'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtremoteobjects qt5compat qtshadertools qtmultimedia
          dir: ${{ runner.temp }}
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.10.1'
          host: mac
          target: ios
          modules: qtremoteobjects qt5compat qtshadertools qtmultimedia
          dir: ${{ runner.temp }}
      - run: |
          pip install conan==2.28.0 jsonschema jinja2
          conan profile detect --force
      - name: Compile app and packet tunnel without distribution signing
        id: build
        shell: bash
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
          IOS_UNSIGNED_BUILD: '1'
        run: |
          set -o pipefail
          deploy/build.sh -t ios 2>&1 | tee client-build.log
      - name: Record baseline result (signed IPA remains blocked)
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: python scripts/routing/build_manifest.py ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-client-ios-unsigned-baseline
          path: |
            client-build.log
            routing-build-manifest.json
            deploy/build/client/tests/qt-regression.xml
            deploy/build/client/tests/Testing/Temporary/LastTest.log
            deploy/build/client/Release-iphoneos/*.app

  build-gate:
    if: always()
    needs: [core-tests, core-cross-compile, client-linux, client-windows, client-android, client-ios]
    runs-on: ubuntu-22.04
    steps:
      - name: Fail for any failed, cancelled or skipped required lane
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          for name, job in results.items():
              print(name, job['result'])
          if any(job['result'] != 'success' for job in results.values()):
              raise SystemExit(1)
          print('Compilation/test gate only; native VPN acceptance is still outstanding.')
          PY
