name: Android application ownership
on:
  push:
    branches: [dev, feature/android-primary-awg-core]
    paths:
      - scripts/routing/android-attribution/**
      - .github/workflows/android-app-ownership.yml
  pull_request:
    paths:
      - scripts/routing/android-attribution/**
      - .github/workflows/android-app-ownership.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
        scenario: [basic, shared-sequential, shared-concurrent]
    steps:
      - uses: actions/checkout@v4
      - name: Select reachable Ubuntu mirror
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 scripts/routing/ci_apt_mirrors.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Enable disposable KVM access
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/routing/android-attribution/run.py --work "$RUNNER_TEMP/attribution" ${{ matrix.scenario == 'shared-sequential' && '--shared-name --sequential --system-txt' || matrix.scenario == 'shared-concurrent' && '--shared-name --system-txt' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-ownership-api-${{ matrix.api }}-${{ matrix.scenario }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/attribution/report.json
            ${{ runner.temp }}/attribution/events.jsonl
