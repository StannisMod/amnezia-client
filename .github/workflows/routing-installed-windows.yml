name: Installed Windows service acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  installed-service:
    strategy:
      fail-fast: false
      matrix:
        kind: [msi, exe]
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/routing/go.mod
          cache-dependency-path: native/routing/go.sum
      - uses: actions/setup-python@v6
        with: {python-version: '3.14'}
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.10.1'
          arch: win64_msvc2022_64
          modules: qtremoteobjects
          dir: ${{ runner.temp }}
      - uses: ilammy/msvc-dev-cmd@v1
        with: {arch: x64}
      - uses: actions/download-artifact@v4
        with:
          name: routing-client-windows-baseline
          run-id: 39966881951
          github-token: ${{ github.token }}
          path: installed-fixture
      - name: Verify current installer provenance and build test clients
        shell: pwsh
        run: |
          $manifest = Get-Content installed-fixture/routing-build-manifest.json | ConvertFrom-Json
          if ($manifest.source_sha -ne '5fd7a8e0ce7a91455a971e61b11688b281815216') { throw 'Installer source mismatch' }
          if ($manifest.client_baseline_compile -ne 'PASS' -or !$manifest.routing_core_packaged_with_service) { throw 'Package build did not pass' }
          foreach ($row in $manifest.artifacts) {
            $packagePath = Join-Path installed-fixture $row.path
            if ((Get-FileHash $packagePath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $row.sha256) { throw "Installer checksum mismatch: $packagePath" }
          }
          git fetch --no-tags --depth=1 origin $manifest.source_sha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code $manifest.source_sha HEAD -- client service native/routing deploy cmake recipes conanfile.py CMakeLists.txt
          if ($LASTEXITCODE -ne 0) { throw 'Production source differs from the pinned installer' }
          cmake -S scripts/routing/service-probe -B routing-service-probe-build -DCMAKE_PREFIX_PATH="$env:RUNNER_TEMP/Qt/6.10.1/msvc2022_64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build routing-service-probe-build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location native/routing
          go build -mod=readonly -tags with_gvisor -o "$env:RUNNER_TEMP/installed-routing-peer.exe" ./cmd/android-fixture
          exit $LASTEXITCODE
      - name: Install verified package and test its actual LocalSystem service
        timeout-minutes: 10
        shell: pwsh
        env:
          PACKAGE_KIND: ${{ matrix.kind }}
        run: |
          $package = (Get-ChildItem "installed-fixture/deploy/build/AmneziaVPN_*_windows_x64.$env:PACKAGE_KIND" | Select-Object -First 1).FullName
          ./scripts/routing/run_windows_installer.ps1 -Kind $env:PACKAGE_KIND -Package $package
          Write-Host 'STAGE installer returned; waiting for service'
          Start-Service AmneziaVPN-service
          (Get-Service AmneziaVPN-service).WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
          Write-Host 'STAGE service running; beginning acceptance'
          python -u scripts/routing/run_service_acceptance.py --require-notices --peer "$env:RUNNER_TEMP/installed-routing-peer.exe" --qt-probe "$env:GITHUB_WORKSPACE/routing-service-probe-build/Release/routing-service-probe.exe" --report "windows-installed-$env:PACKAGE_KIND.json" 2>&1 | Tee-Object -FilePath windows-service-acceptance.log
          exit $LASTEXITCODE
      - name: Restore owned policy and remove test installation
        if: always()
        timeout-minutes: 8
        shell: pwsh
        env:
          PACKAGE_KIND: ${{ matrix.kind }}
        run: |
          $probe = "$env:GITHUB_WORKSPACE/routing-service-probe-build/Release/routing-service-probe.exe"
          if (Test-Path $probe) { & $probe off }
          # Exercise each package's own service-removal operations. A separate
          # SCM stop here prevents the actual uninstaller from even running.
          sc.exe queryex AmneziaVPN-service
          $helper = Get-ChildItem "$env:ProgramFiles/AmneziaVPN" -Filter amnezia-routing.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($helper) { & $helper.FullName --recover }
          if ($env:PACKAGE_KIND -eq 'msi') {
            $package = Get-ChildItem installed-fixture/deploy/build/*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($package) { ./scripts/routing/run_windows_installer.ps1 -Kind msi -Package $package.FullName -Uninstall -LogPath routing-msi-remove.log }
          } else {
            $maintenance = "$env:ProgramFiles/AmneziaVPN/maintenancetool.exe"
            if (Test-Path $maintenance) { ./scripts/routing/run_windows_installer.ps1 -Kind exe -Package $maintenance -Uninstall }
          }
          if (Get-Service AmneziaVPN-service -ErrorAction SilentlyContinue) { throw 'Package uninstall left its service registered' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installed-${{ matrix.kind }}-acceptance
          path: |
            windows-installed-*.json
            windows-service-acceptance.log
            routing-msi-install.log
            routing-msi-remove.log
